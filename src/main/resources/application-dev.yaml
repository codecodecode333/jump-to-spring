spring:
  thymeleaf:
    cache: false # 템플릿 수정 시 바로 반영
    prefix: file:src/main/resources/templates/ # 빌드 결과물이 아닌 소스 폴더를 직접 읽어서, 재빌드 없이 새로고침만으로 반영
  datasource:
    url: jdbc:h2:./db_dev;MODE=MySQL # 프로젝트 폴더의 db_dev.mv.db 파일에 저장 (재시작해도 유지)
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console
