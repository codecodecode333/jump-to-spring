<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${question.subject}"></title>
</head>
<body>
<div layout:fragment="content" class="container my-3">
    <!-- 질문 -->
    <h2 class="border-bottom py-2" th:text="${question.subject}"></h2>
    <div class="card my-3">
        <div class="card-body">
            <div class="card-text" style="white-space: pre-line;" th:text="${question.content}"></div>
            <div class="d-flex justify-content-end">
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2"><span th:text="${question.author?.username}"></span></div>
                    <div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <!-- 수정된 적이 있으면 수정일시도 표시 (생성 시에는 createDate == modifyDate) -->
                <div class="badge bg-light text-dark p-2 text-start ms-2"
                     th:if="${!question.modifyDate.equals(question.createDate)}">
                    <div class="mb-2">modified at</div>
                    <div th:text="${#temporals.format(question.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <div class="my-3">
                <!-- POST 요청이므로 a[method] + global.js (CSRF 토큰 포함) -->
                <a th:href="@{|/questions/${question.id}/votes|}" method="post"
                   data-confirm="정말로 추천하시겠습니까?" class="btn btn-sm btn-outline-secondary">
                    추천 <span class="badge rounded-pill bg-success" th:text="${#sets.size(question.voters)}"></span>
                </a>
            </div>
            <!-- 글쓴이에게만 수정 버튼 -->
            <div class="my-3" th:if="${question.author != null and #authentication.name == question.author.username}">
                <a th:href="@{|/questions/${question.id}/modify|}" class="btn btn-sm btn-outline-secondary">수정</a>
                <!-- method, data-confirm 속성은 global.js 가 처리 -->
                <a th:href="@{|/questions/${question.id}|}" method="delete" data-confirm="정말로 삭제하시겠습니까?"
                   class="btn btn-sm btn-outline-danger">삭제</a>
            </div>
        </div>
    </div>

    <!-- 답변 개수 -->
    <h5 class="border-bottom my-3 py-2" th:text="|${#lists.size(question.answers)}개의 답변이 있습니다.|"></h5>

    <!-- 답변 반복 -->
    <div class="card my-3" th:each="answer : ${question.answers}">
        <div class="card-body">
            <div class="card-text" style="white-space: pre-line;" th:text="${answer.content}"></div>
            <div class="d-flex justify-content-end">
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2"><span th:text="${answer.author?.username}"></span></div>
                    <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <div class="badge bg-light text-dark p-2 text-start ms-2"
                     th:if="${!answer.modifyDate.equals(answer.createDate)}">
                    <div class="mb-2">modified at</div>
                    <div th:text="${#temporals.format(answer.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <div class="my-3">
                <a th:href="@{|/questions/${question.id}/answers/${answer.id}/votes|}" method="post"
                   data-confirm="정말로 추천하시겠습니까?" class="btn btn-sm btn-outline-secondary">
                    추천 <span class="badge rounded-pill bg-success" th:text="${#sets.size(answer.voters)}"></span>
                </a>
            </div>
            <div class="my-3" th:if="${answer.author != null and #authentication.name == answer.author.username}">
                <a th:href="@{|/questions/${question.id}/answers/${answer.id}/modify|}"
                   class="btn btn-sm btn-outline-secondary">수정</a>
                <a th:href="@{|/questions/${question.id}/answers/${answer.id}|}" method="delete"
                   data-confirm="정말로 삭제하시겠습니까?" class="btn btn-sm btn-outline-danger">삭제</a>
            </div>
        </div>
    </div>

    <!-- 답변 작성 -->
    <form th:action="@{|/questions/${question.id}/answers|}" method="post" class="my-3" th:object="${answerForm}">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <textarea th:field="*{content}" rows="10" class="form-control"></textarea>
        <input type="submit" value="답변등록" class="btn btn-primary my-2">
    </form>
</div>
</body>
</html>
