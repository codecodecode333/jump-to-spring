<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>질문 목록</title>
</head>
<body>
<div layout:fragment="content" class="container my-3">
    <table class="table">
        <thead class="table-dark">
        <tr class="text-center">
            <th>번호</th>
            <th style="width:50%">제목</th>
            <th>글쓴이</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="question, loop : ${paging}">
            <!-- 번호 = 전체 개수 - (현재 페이지 * 페이지 크기) - 페이지 안에서의 순서 → 최신 글이 가장 큰 번호 -->
            <td th:text="${paging.totalElements - (paging.number * paging.size) - loop.index}"></td>
            <td>
                <a th:href="@{|/questions/${question.id}|}" th:text="${question.subject}"></a>
                <!-- 답변이 있을 때만 개수 표시 -->
                <span class="text-danger small ms-2" th:if="${#lists.size(question.answers) > 0}"
                      th:text="${#lists.size(question.answers)}"></span>
            </td>
            <!-- ?. : author 가 null 이면 오류 대신 빈 값 (글쓴이 기능 이전 데이터) -->
            <td><span th:text="${question.author?.username}"></span></td>
            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>

    <!-- 페이징: paging.number 는 0부터, 화면/URL 은 1부터 -->
    <nav th:if="${!paging.isEmpty()}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{/questions(page=${paging.number})}">이전</a>
            </li>
            <!-- 현재 페이지 앞뒤 5개만 표시 -->
            <li th:each="page : ${#numbers.sequence(1, paging.totalPages)}"
                th:if="${page >= paging.number + 1 - 5 and page <= paging.number + 1 + 5}"
                th:classappend="${page == paging.number + 1} ? 'active'" class="page-item">
                <a th:text="${page}" class="page-link" th:href="@{/questions(page=${page})}"></a>
            </li>
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{/questions(page=${paging.number + 2})}">다음</a>
            </li>
        </ul>
    </nav>
    <a th:href="@{/questions/write}" class="btn btn-primary">질문 등록하기</a>
</div>
</body>
</html>
