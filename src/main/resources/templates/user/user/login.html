<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>로그인</title>
</head>
<body>
<div layout:fragment="content" class="container my-3">
    <div class="my-3 border-bottom">
        <h4>로그인</h4>
    </div>
    <!-- 이 폼은 컨트롤러가 아니라 스프링 시큐리티의 로그인 필터가 처리한다 (POST /users/login) -->
    <form th:action="@{/users/login}" method="post">
        <!-- 로그인 실패 시 시큐리티가 /users/login?error 로 돌려보낸다 -->
        <div th:if="${param.error}" class="alert alert-danger">
            사용자ID 또는 비밀번호를 확인해 주세요.
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">사용자ID</label>
            <input type="text" name="username" id="username" class="form-control" autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" name="password" id="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">로그인</button>
    </form>
</div>
</body>
</html>
